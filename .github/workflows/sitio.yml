# Regenera site/data.json cuando cambian los datos en main (ej. al aprobar un PR de precios).
# Los PR del scraper no traen data.json para no chocar con los commits diarios de oil.yml.
name: sitio

on:
  push:
    branches: [main]
    paths:
      - "data/*.csv"
      - "etl/build_site_data.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  data-json:
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils # pdftotext para test_historico

      - run: python -m pytest -q

      - name: Regenerar y commitear data.json
        id: commit
        run: |
          python -m etl.build_site_data
          # "generado" cambia en cada corrida: commitear solo si cambió algo más
          if ! cmp -s <(git show HEAD:site/data.json | jq -cS 'del(.generado)') \
                      <(jq -cS 'del(.generado)' site/data.json); then
            # imagen para compartir (og:image): solo cuando cambian los datos, no en cada corrida diaria de oil.yml
            python -m etl.og_image || echo "::warning::No se pudo regenerar site/og.png; queda la anterior."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data.json site/og.png
            git commit -m "Sitio: data.json regenerado"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "data.json sin cambios de datos."
          fi

      # Deploy Hook de Vercel (salida c del README): desactivado hasta que exista el secret.
      # Los secrets no se pueden usar en if:, por eso pasa por el env del job.
      - name: Avisar a Vercel (Deploy Hook)
        if: steps.commit.outputs.pushed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
