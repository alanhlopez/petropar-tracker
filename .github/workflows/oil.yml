# Precios internacionales diarios (EIA): commit directo a main, sin revisión (dato de API oficial).
# También regenera site/data.json: un push con GITHUB_TOKEN no dispara sitio.yml.
name: oil

on:
  schedule:
    - cron: "30 14 * * *" # la EIA publica los spot del día hábil anterior
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-main
  cancel-in-progress: false

jobs:
  oil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bajar WTI y ULSD
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m etl.fetch_oil

      - name: Commit si hay datos nuevos
        run: |
          git add -N data/petroleo.csv
          if git diff --quiet -- data/petroleo.csv; then
            echo "Sin datos nuevos de la EIA."
            exit 0
          fi
          python -m etl.build_site_data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/petroleo.csv site/data.json
          git commit -m "Petróleo: datos EIA al $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
