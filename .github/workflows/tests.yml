# pytest en cada push y PR. Ojo: los PR abiertos por el scraper con GITHUB_TOKEN no disparan
# este workflow; por eso scrape.yml corre pytest antes de abrir el PR.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q
