# pytest en cada push y PR. Ojo: en los PR que abre el scraper con GITHUB_TOKEN este workflow no
# llega a correr (GitHub deja una corrida en rojo sin jobs, "workflow file issue"); ese rojo no
# indica tests fallidos. La garantía es que scrape.yml corre pytest antes de abrir el PR.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils # pdftotext para test_historico

      - run: python -m pytest -q
